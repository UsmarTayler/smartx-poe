# Brings up the API, the client and the device simulator together. No .env is needed:
#   docker compose up --build
# Then open http://localhost:8080. Copy .env.example to .env only to change a setting.

name: smartx

services:
  api:
    build:
      context: .
      dockerfile: src/SmartX.Api/Dockerfile
    image: smartx-api
    environment:
      # Defaults to the development key published in the README and .env.example, so a fresh clone starts with no .env.
      # It protects nothing, since anyone with the repository has it, and the API logs a warning when it runs outside
      # Development with it. Set SMARTX_ATTACHMENT_KEY to a private key (openssl rand -base64 32) for anything but a demo.
      Attachments__EncryptionKey: ${SMARTX_ATTACHMENT_KEY:-jk8ISNL3b2INdPgIONnlaaf0nycILpHni4khrvGdBlg=}
      # The deployment the simulated fleet is registered into. The zones are gateway configuration; the
      # devices in them come from the simulator over HTTP.
      Zones__Hierarchy: ${SMARTX_ZONE_HIERARCHY:-Demo}
      Ingestion__MaxQueueDepth: ${SMARTX_QUEUE_DEPTH:-10000}
      # Simulates the per-reading processing cost of a constrained gateway. Zero is an unconstrained one.
      Ingestion__SimulatedGatewayCost: ${SMARTX_PROCESS_DELAY:-00:00:00}
      # How soon after an event an operator's action counts as a response to it, and how fast learned habits fade. A short
      # window lets the pattern analysis be demonstrated in minutes instead of over a shift.
      Patterns__Window: ${SMARTX_PATTERN_WINDOW:-00:10:00}
      Patterns__HalfLife: ${SMARTX_PATTERN_HALFLIFE:-7.00:00:00}
      SeededHistory__Enabled: ${SMARTX_SEED_HISTORY:-true}
      # Who may call the API. Like the attachment key, the defaults are the development values published in the README, so a fresh
      # clone works with no .env; they protect nothing, and the API logs a warning at start-up for each one still in use. Set
      # SMARTX_AUTH_SIGNING_KEY (openssl rand -base64 48), SMARTX_FLEET_SECRET (openssl rand -base64 32) and
      # SMARTX_DEMO_USERS=false, and give the API real users (Auth__Users), for anything but a demo.
      Auth__SigningKey: ${SMARTX_AUTH_SIGNING_KEY:-smartx-development-signing-key-not-a-secret-0001}
      Auth__FleetSecret: ${SMARTX_FLEET_SECRET:-smartx-development-fleet-secret-not-a-secret}
      Auth__SeedDemoUsers: ${SMARTX_DEMO_USERS:-true}
      # The API is reached only through nginx here, which puts the client's address in X-Forwarded-For. Believing it lets the login
      # rate limit count each browser separately and not nginx as one client. Not safe where the API port is open to the internet.
      Auth__TrustForwardedHeaders: "true"
    volumes:
      # Encrypted files and their index, kept across container restarts and rebuilds.
      - attachments:/data/attachments
    healthcheck:
      # The runtime image has no curl or wget, and installing one only to check a URL would add a package
      # to the image. bash can open the connection itself: send a request, read the status line, and pass
      # only if it says 200.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /api/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      # Published for curl and the scenario endpoint. The client does not need it; it goes through nginx.
      - "${SMARTX_API_PORT:-5266}:8080"
    networks:
      - smartx
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: src/SmartX.DeviceSimulator/Dockerfile
    image: smartx-simulator
    environment:
      Simulator__ApiBaseUrl: http://api:8080
      # The same secret the API derives device keys from. Each device sends its own MAC and HMAC-SHA256(secret, MAC); the secret
      # itself never leaves this container.
      Simulator__FleetSecret: ${SMARTX_FLEET_SECRET:-smartx-development-fleet-secret-not-a-secret}
      Simulator__DeviceCount: ${SMARTX_DEVICE_COUNT:-55}
      Simulator__Mix: ${SMARTX_SCENARIO_MIX:-Demo}
      Simulator__BackfillDuration: ${SMARTX_BACKFILL:-00:10:00}
      Simulator__ReportingRateMultiplier: ${SMARTX_RATE:-1}
      Simulator__TickInterval: ${SMARTX_TICK:-00:00:00.500}
    depends_on:
      api:
        # Health checks narrow the start-up race, they do not remove it: the API can still restart later,
        # and real devices power on before their gateway does. The simulator retries with backoff regardless.
        condition: service_healthy
    networks:
      - smartx
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: src/SmartX.Client/Dockerfile
    image: smartx-client
    environment:
      # "/" means the client's own origin; nginx forwards /api to the api service above.
      API_BASE_ADDRESS: /
    ports:
      - "${SMARTX_CLIENT_PORT:-8080}:8080"
    depends_on:
      - api
    networks:
      - smartx
    restart: unless-stopped

networks:
  smartx:

volumes:
  attachments:
