# Brings up the API, the client and the device simulator together:
#   cp .env.example .env
#   docker compose up --build
# Then open http://localhost:8080.

name: smartx

services:
  api:
    build:
      context: .
      dockerfile: src/SmartX.Api/Dockerfile
    image: smartx-api
    environment:
      # Required outside Development, and deliberately not defaulted here: compose stops with this message
      # rather than starting an API that refuses to run.
      Attachments__EncryptionKey: ${SMARTX_ATTACHMENT_KEY:?Set SMARTX_ATTACHMENT_KEY - copy .env.example to .env}
      # The deployment the simulated fleet is registered into. The zones are gateway configuration; the
      # devices in them come from the simulator over HTTP.
      Zones__Hierarchy: ${SMARTX_ZONE_HIERARCHY:-Demo}
      Ingestion__MaxQueueDepth: ${SMARTX_QUEUE_DEPTH:-10000}
      # Simulates the per-reading processing cost of a constrained gateway. Zero is an unconstrained one.
      Ingestion__SimulatedGatewayCost: ${SMARTX_PROCESS_DELAY:-00:00:00}
    volumes:
      # Encrypted files and their index, kept across container restarts and rebuilds.
      - attachments:/data/attachments
    healthcheck:
      # The runtime image has no curl or wget, and installing one only to check a URL would add a package
      # to the image. bash can open the connection itself: send a request, read the status line, and pass
      # only if it says 200.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /api/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      # Published for curl and the scenario endpoint. The client does not need it; it goes through nginx.
      - "${SMARTX_API_PORT:-5266}:8080"
    networks:
      - smartx
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: src/SmartX.DeviceSimulator/Dockerfile
    image: smartx-simulator
    environment:
      Simulator__ApiBaseUrl: http://api:8080
      Simulator__DeviceCount: ${SMARTX_DEVICE_COUNT:-48}
      Simulator__Mix: ${SMARTX_SCENARIO_MIX:-Demo}
      Simulator__BackfillDuration: ${SMARTX_BACKFILL:-00:10:00}
      Simulator__ReportingRateMultiplier: ${SMARTX_RATE:-1}
      Simulator__TickInterval: ${SMARTX_TICK:-00:00:00.500}
    depends_on:
      api:
        # Health checks narrow the start-up race, they do not remove it: the API can still restart later,
        # and real devices power on before their gateway does. The simulator retries with backoff regardless.
        condition: service_healthy
    networks:
      - smartx
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: src/SmartX.Client/Dockerfile
    image: smartx-client
    environment:
      # "/" means the client's own origin; nginx forwards /api to the api service above.
      API_BASE_ADDRESS: /
    ports:
      - "${SMARTX_CLIENT_PORT:-8080}:8080"
    depends_on:
      - api
    networks:
      - smartx
    restart: unless-stopped

networks:
  smartx:

volumes:
  attachments:
