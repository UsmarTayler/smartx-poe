# Serves the Blazor client and forwards /api to the API container.
#
# Forwarding is what lets the client's ApiBaseAddress be "/": the browser loads the app and calls the API on
# one origin, so it never needs to resolve the "api" service name (which only exists inside the compose
# network) and no cross-origin request is made.

# Whether a request is asking for an upgrade decides what the Connection header sent to the API says. A request that
# is not (an ordinary page or API call) must not be told to upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        # No trailing slash on the target, so /api/sensors reaches the API as /api/sensors.
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Attachments stream straight through. By default nginx spools a whole request body to disk before
        # forwarding it, which would undo the API's streaming upload, and would apply its own 1 MB size
        # limit. The API enforces the real limit itself, byte by byte.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The real-time hub. SignalR prefers WebSockets, and a proxy that does not pass the upgrade does not break it:
    # it quietly falls back to long polling, which works, so nobody notices that "push" has become a request held
    # open and repeated. Three settings make the upgrade work, and each is needed:
    #   - HTTP/1.1 to the API, because the upgrade handshake does not exist in HTTP/1.0 (nginx's default upstream).
    #   - The Upgrade and Connection headers passed through. nginx strips both by default, because they are
    #     hop-by-hop headers, which is precisely what the upgrade needs to survive.
    #   - A read timeout longer than any idle gap. nginx closes a proxied connection that carries no data for 60
    #     seconds by default; an idle WebSocket is silent between SignalR's keep-alive pings.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Messages are pushed as they happen. Buffering would hold them.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Always revalidated, so a redeployed client or a changed API address is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /appsettings.json {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes such as /sensors/AA:BB:CC:DD:EE:01 have no file behind them; the app handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
